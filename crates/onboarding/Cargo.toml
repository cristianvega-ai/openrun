[package]
name = "onboarding"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "onboarding"
path = "src/bin/main.rs"
required-features = ["bin"]

[features]
bin = []

[dependencies]
anyhow.workspace = true
pathfinder_color.workspace = true
pathfinder_geometry.workspace = true
rust-embed.workspace = true
ui_components.workspace = true
warp_core = { workspace = true }
warpui.workspace = true
warpui_core.workspace = true
warp_logging.workspace = true

[dev-dependencies]
warp_core = { workspace = true, features = ["test-util"] }
