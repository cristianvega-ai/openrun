[profile.default]
leak-timeout = { period = "100ms", result = "fail" }
# Mark a test as slow if it takes longer than 30s to execute, and terminate it
# if it takes 2x as long as the slow timeout (i.e.: 60s total).
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Every accepted Git generator runs against hostile repositories in all required Git versions.
filter = 'test(~the_git_generators_run_nothing_and_connect_nowhere_through_the_production_executor)'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.overrides]]
# The idle session sleeps for two minutes by design.
filter = 'test(~test_idle_session)'
slow-timeout = { period = "150s", terminate-after = 2 }

[[profile.default.overrides]]
# Four interactive PowerShell sessions at once, each waiting for its prompt (tens of seconds under
# the strace sandbox) and then holding to see whether it sends anything.
filter = 'test(~powershell_update_check_and_telemetry_are_switched_off)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
# The injection corpus starts thousands of real shells (bash, zsh, sh, fish, and PowerShell 7 at
# a fraction of a second each) and shares the runner with the rest of the suite.
filter = 'test(~generator_policy::tests::injection_corpus)'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'package(integration)'
# Integration tests are heavier-weight than unit tests, so have each one
# count twice against the parallelism limit.  This improves overall runtime
# of the test suite, despite running fewer integration tests at a time.
threads-required = 2

[profile.ci]
# No retries in CI for any test. A test that fails and then passes on a retry is flaky, which is not
# a pass; retrying it would hide that behind a green run.
retries = 0
# Print out output for failing tests as soon as they fail, and also at the end
# of the run (for easy scrollability).
failure-output = "immediate-final"
# Do not cancel the test run on the first failure.
fail-fast = false

[[profile.ci.overrides]]
filter = 'package(integration)'
# No retries on CI. A test that fails and then passes on a retry is flaky, which is not a pass;
# retrying it would hide that behind a green run.
retries = 0

[profile.ci.junit]
# Output nextest results in junit format (for uploading to buildpulse).
# If `--profile ci` is selected on the command line, then the JUnit report will
# be written out to `target/nextest/ci/junit.xml`. 
# Docs: https://nexte.st/docs/machine-readable/junit/
path = "junit.xml"
