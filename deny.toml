[graph]
# Match the audit in script/offline_audit: every feature, runtime and build edges only.
all-features = true
exclude-dev = true

[advisories]
git-fetch-with-cli = true
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, but considered to be complete." },
    { id = "RUSTSEC-2024-0388", reason = "derivative is unmaintained; we should try to find an alternative." },
    { id = "RUSTSEC-2024-0425", reason = "get-size is unmaintained; we should try to find an alternative." },
    { id = "RUSTSEC-2024-0427", reason = "get-size-derive is an unmaintained dependency of get-size." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a unmaintained dependency of get-size-derive." },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; we should migrate to web-time." },
    { id = "RUSTSEC-2020-0077", reason = "memmap is unmaintained; we should migrate to memmap2." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; this is a dependency of metal, which we should eliminate by moving to the objc2 family of crates."},
]

[licenses]
# Don't worry about licenses for crates in this workspace.
private = { ignore = true }
# Explicitly allowed licenses.
# This list must stay in sync with about.toml's accepted list.
# CI enforces this via script/check_license_config_sync.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
# We allow dependencies on multiple versions of crates.
multiple-versions = "allow"
# Do not allow wildcard versions, except in our private path-based dependencies
# (i.e.: workspace crates).
wildcards = "deny"
allow-wildcard-paths = true

# The fork is offline: nothing in the dependency graph may talk to Warp services, report crashes,
# export telemetry or speak the removed protocols. A crate with `wrappers` may appear only as a
# direct dependency of the listed crates. script/offline_audit checks the same graph and lists
# the workspace crates that must not exist.
deny = [
    # HTTP stack: only the shared HTTP client and the loopback control server may use it.
    { crate = "reqwest", wrappers = ["http_client", "local_control"], reason = "network access goes through http_client; local_control is loopback only" },
    { crate = "hyper", wrappers = ["reqwest", "axum", "hyper-util", "hyper-rustls"], reason = "transport of reqwest and the local_control axum server" },
    { crate = "axum", wrappers = ["warp"], reason = "local_control server only" },
    { crate = "tower-http", wrappers = ["reqwest"], reason = "unconditional dependency of reqwest; nothing else may use it" },
    { crate = "interprocess", reason = "the local IPC crate was removed with the single-instance service it served; do not reintroduce it" },
    # Warp server protocols and clients.
    { crate = "cynic", reason = "GraphQL client for the removed Warp server" },
    { crate = "tungstenite", reason = "websocket transport of the removed Warp server and session sharing" },
    { crate = "async-tungstenite", reason = "websocket transport of the removed Warp server and session sharing" },
    { crate = "session-sharing-protocol", reason = "session sharing is removed" },
    { crate = "warp_multi_agent_api", reason = "Warp agent protocol is removed" },
    { crate = "oauth2", reason = "no account or MCP sign-in flows" },
    { crate = "rmcp", reason = "MCP is removed" },
    # Crash reporting and telemetry export.
    { crate = "sentry", reason = "crash reporting is removed" },
    { crate = "sentry-core", reason = "crash reporting is removed" },
    { crate = "sentry-log", reason = "crash reporting is removed" },
    { crate = "minidumper", reason = "crash reporting is removed" },
    { crate = "crash-handler", reason = "crash reporting is removed" },
    { crate = "opentelemetry-otlp", reason = "telemetry export is removed" },
    { crate = "opentelemetry-http", reason = "telemetry export is removed" },
]

[sources]
allow-git = [
    # Allow git reference to Core Foundation crates until they publish an updated
    # version to crates.io.
    "https://github.com/servo/core-foundation-rs",
]
# Build-time git dependencies: the forks and Warp-authored crates (vte, font-kit, notify,
# command-signatures, warp-workflows, ...) are still fetched from the warpdotdev organization.
# Nothing they do at runtime reaches a Warp service; this only lets cargo fetch the sources at
# build time. Drop this entry when those dependencies are vendored or repointed.
allow-org = { github = ["warpdotdev"] }
