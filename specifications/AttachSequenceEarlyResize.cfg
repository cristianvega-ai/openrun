\* An expected violation.  A client resizes after its attach was applied but
\* before it receives its snapshot.  The snapshot carries the old size, and
\* the requester gets no sizeChanged.  TLC must find this state: every queue
\* empty, the session at size 2, and client 1 (a subscriber) drawing at
\* size 1, so QuiescentSizeAgreement is false.
\*
\* The session process does not promise this property.  Each client sends its
\* own window size after it restores the snapshot.  AttachCommand.run does
\* this for openrun attach, and so the gap is closed in the client.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 2
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 2}
  QueryChunks = {2}
INVARIANTS
  QuiescentSizeAgreement
CHECK_DEADLOCK FALSE
