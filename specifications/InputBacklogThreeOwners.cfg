\* The code, with 3 owners, a limit of 2 bytes and 1 typed byte for each
\* owner.  TLC must find no violation.
SPECIFICATION Specification
CONSTANTS
  OwnerCount = 3
  ByteLimit = 2
  MaximumTypedPerOwner = 1
  AnswerCount = 1
  WithdrawalEnabled = TRUE
INVARIANTS
  OwnerOrder
  NoByteAfterWithdraw
  RepliesKeepPlace
  BacklogWithinLimit
  LeftOwnersHoldNothing
CHECK_DEADLOCK FALSE
