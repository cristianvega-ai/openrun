\* A control.  It removes the release of a wait when the waiting client
\* leaves.  The session then waits for a client that has gone, and parsing
\* stops.  TLC must find that EveryChunkIsParsed is false.  TLC does not name
\* the temporal property that fails, so this file checks only this one.
\* ReleasesWaitOnLeave is a definition of the model, and this file replaces it.
SPECIFICATION LiveSpecification
CONSTANTS
  ClientCount = 2
  ChunkCount = 2
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {1, 2}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
  ReleasesWaitOnLeave = FALSE
PROPERTY EveryChunkIsParsed
CHECK_DEADLOCK FALSE
