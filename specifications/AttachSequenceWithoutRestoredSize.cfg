\* A control.  It removes the protection that puts the old size back when the
\* snapshot capture throws, so the new size stays in place.  TLC must find
\* that NoRefusedSize is false.  The code has the protection, so
\* AttachSequence.cfg passes.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 3
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = FALSE
  RelayingClients = {1}
  SizeSubscribers = {1, 2}
  QueryChunks = {2}
INVARIANTS
  NoGapNoRepeat
  NoRefusedSize
  NoRefusedAnnouncement
  SizeOrder
  ReplyGate
  SingleReply
  ReplyOwnership
CHECK_DEADLOCK FALSE
