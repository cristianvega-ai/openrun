\* The code.  Session.attach puts the old size back after a failed attach,
\* and it announces a size only after a successful attach.  The model leaves
\* out the rare path where the old size cannot be put back: there the new
\* size stays and is announced (see the comment of Session.attach).  TLC
\* must find no violation.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 3
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {1}
  SizeSubscribers = {1, 2}
  QueryChunks = {2}
INVARIANTS
  NoGapNoRepeat
  NoRefusedSize
  NoRefusedAnnouncement
  SizeOrder
  ReplyGate
  SingleReply
  ReplyOwnership
CHECK_DEADLOCK FALSE
