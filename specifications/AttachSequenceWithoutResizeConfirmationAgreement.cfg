\* With no output, a queued foreign size can follow a local resize.  Without
\* a confirmation, the requester stays at the foreign size.  Agreement fails.
SPECIFICATION StaleForeignControlSpecification
CONSTANTS
  ClientCount = 2
  ChunkCount = 0
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {1, 2}
  ConfirmResizes = FALSE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {}
INVARIANTS
  ConfirmedSizeAgreement
CHECK_DEADLOCK FALSE
