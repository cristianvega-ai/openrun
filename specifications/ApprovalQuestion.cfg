\* The code, with one signed answerer and one impostor.  TLC must find no
\* violation.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = TRUE
  AnswerNamesQuestion = TRUE
  ResolutionIsFinal = TRUE
  WithdrawOnLeave = TRUE
  UnknownCallerRefused = TRUE
  DenyWithoutAnswerer = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  AllowsComeFromSignedAnswerers
  QuestionsReachOnlySignedAnswerers
  AllowsApplyToTheirQuestion
  PerformedOnlyWithAllow
  NoAllowAfterDenial
  NoAllowForGoneCaller
  WaitingQuestionsHaveAnAnswerer
  ShownOnlyWhileWaiting
CHECK_DEADLOCK FALSE
