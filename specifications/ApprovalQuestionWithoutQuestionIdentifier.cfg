\* A control.  An answer does not name its question, and the session process
\* applies it to a question that waits.  An allow for one request then
\* performs another.  TLC must find that AllowsApplyToTheirQuestion is false.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = TRUE
  AnswerNamesQuestion = FALSE
  ResolutionIsFinal = TRUE
  WithdrawOnLeave = TRUE
  UnknownCallerRefused = TRUE
  DenyWithoutAnswerer = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  AllowsApplyToTheirQuestion
CHECK_DEADLOCK FALSE
