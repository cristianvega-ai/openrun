\* The code.  A parsed query is answered, each wait for room ends, and every
\* chunk is parsed.  No relaying client is attached, so the session process
\* answers every query itself.  TLC must find no violation.
SPECIFICATION LiveSpecification
CONSTANTS
  ClientCount = 2
  ChunkCount = 2
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {1, 2}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
INVARIANTS
  ServerCapacity
  OutputWaitIsValid
  OutputWaitBoundsQueue
  NoPauseWhileViewerKeepsUp
  NoGapNoRepeat
  NoRefusedSize
  SizeOrder
  SingleReply
  ReplyOwnership
PROPERTIES
  QueryEventuallyAnswered
  WaitingForRoomEnds
  EveryChunkIsParsed
CHECK_DEADLOCK FALSE
