\* A control.  It removes the stopping state of SessionRegistry.  A client that
\* is already connected sends createSession while shutdown runs, and the new
\* session is not in the list that terminateAll copied.  TLC must find that
\* NoSessionStartsDuringShutdown is false.  The code has the stopping state,
\* so SessionLifecycle.cfg passes.
SPECIFICATION Specification
CONSTANTS
  SessionCount = 2
  ClientCount = 2
  StoppingStateExists = FALSE
INVARIANTS
  NoSessionStartsDuringShutdown
  StatusAnsweredAtMostOnce
  LiveSessionsHavePrograms
CHECK_DEADLOCK FALSE
