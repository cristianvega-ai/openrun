\* A control.  It removes the wake when another viewer drains: a wait goes on
\* after another viewer has caught up.  TLC must find that
\* NoPauseWhileViewerKeepsUp is false.  WakesOnOtherViewerDrain is a
\* definition of the model, and this file replaces it.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 3
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {1}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {2}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
  WakesOnOtherViewerDrain = FALSE
INVARIANT NoPauseWhileViewerKeepsUp
CHECK_DEADLOCK FALSE
