\* The code, checked for liveness with weak fairness of the time limit and of
\* the answer to the hook.  Every request and every hook ends.  TLC must find
\* no violation.
SPECIFICATION LiveSpecification
CONSTANTS
  RequestCount = 3
  ThreadCount = 2
  GenuineRequests = {1, 2}
  LyingRequests = {2}
  AnswererCount = 3
  SignedAnswerers = {1, 2}
  OutsideAnswerers = {1, 3}
  SignatureCheckExists = TRUE
  PlaceCheckExists = TRUE
  CallerCheckExists = TRUE
  ThreadComesFromCaller = TRUE
  ResolutionIsFinal = TRUE
  FailureBlocks = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  AllowOnlyFromUser
  ToolRunsOnlyWithUserAllow
  NoAllowAfterEnd
  RequestShowsInThreadOfItsAgent
PROPERTIES
  EveryRequestEnds
  EveryHookEnds
CHECK_DEADLOCK FALSE
