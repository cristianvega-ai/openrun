\* A control.  The session process takes a request from a program that no
\* agent started.  TLC must find that RequestShowsInThreadOfItsAgent is
\* violated.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 3
  ThreadCount = 2
  GenuineRequests = {1, 2}
  LyingRequests = {2}
  AnswererCount = 3
  SignedAnswerers = {1, 2}
  OutsideAnswerers = {1, 3}
  SignatureCheckExists = TRUE
  PlaceCheckExists = TRUE
  CallerCheckExists = FALSE
  ThreadComesFromCaller = TRUE
  ResolutionIsFinal = TRUE
  FailureBlocks = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  AllowOnlyFromUser
  ToolRunsOnlyWithUserAllow
  NoAllowAfterEnd
  RequestShowsInThreadOfItsAgent
CHECK_DEADLOCK FALSE
