\* The code of a launch agent, checked for liveness with weak fairness.  The
\* idle exit ends no session, and a launch agent with no client and no
\* session closes its socket.  Kill, shutdown and the answers keep their
\* properties.  One session keeps the run short; the idle exit needs only one.
\* TLC must find no violation.
SPECIFICATION LiveSpecification
CONSTANTS
  SessionCount = 1
  ClientCount = 2
  StoppingStateExists = TRUE
  LaunchAgent = TRUE
  IdleCheckExists = TRUE
INVARIANTS
  NoSessionStartsDuringShutdown
  StatusAnsweredAtMostOnce
  LiveSessionsHavePrograms
  IdleExitEndsNoSession
PROPERTIES
  KillEndsItsSession
  ShutdownEndsEverySession
  EveryWaiterAnswered
  IdleAgentCloses
CHECK_DEADLOCK FALSE
