\* The code, checked for liveness with weak fairness.  Kill ends its session,
\* shutdown ends every session, and every waiting client gets an answer.  TLC
\* must find no violation.
SPECIFICATION LiveSpecification
CONSTANTS
  SessionCount = 2
  ClientCount = 2
  StoppingStateExists = TRUE
INVARIANTS
  NoSessionStartsDuringShutdown
  StatusAnsweredAtMostOnce
  LiveSessionsHavePrograms
PROPERTIES
  KillEndsItsSession
  ShutdownEndsEverySession
  EveryWaiterAnswered
CHECK_DEADLOCK FALSE
