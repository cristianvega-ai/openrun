\* Three clients with the output-room wait, for the liveness of the wait.
\* Two output chunks keep the run small: the first fills the slow clients,
\* and the second shows that parsing resumes after the wait.
SPECIFICATION LiveSpecification
CONSTANTS
  ClientCount = 3
  ChunkCount = 2
  OutputLimit = 3
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 3}
  ConfirmingClients = {1}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
INVARIANTS
  ServerCapacity
  OutputWaitIsValid
  OutputWaitBoundsQueue
  NoGapNoRepeat
  NoRefusedSize
  NoRefusedAnnouncement
  SizeOrder
  ConfirmedSizeAgreement
  ReplyGate
  SingleReply
  ReplyOwnership
PROPERTIES
  QueryEventuallyAnswered
  WaitingForRoomEnds
CHECK_DEADLOCK FALSE
VIEW SafetyView
