\* A control.  The session process takes questions and answers from any
\* program.  The impostor then allows a question.  TLC must find that
\* AllowsComeFromSignedAnswerers is false.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = FALSE
  AnswerNamesQuestion = TRUE
  ResolutionIsFinal = TRUE
  WithdrawOnLeave = TRUE
  UnknownCallerRefused = TRUE
  DenyWithoutAnswerer = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  AllowsComeFromSignedAnswerers
CHECK_DEADLOCK FALSE
