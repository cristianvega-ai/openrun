\* A control.  A hook that fails does not block the tool.  TLC must find that
\* ToolRunsOnlyWithUserAllow is violated.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 3
  ThreadCount = 2
  GenuineRequests = {1, 2}
  LyingRequests = {2}
  AnswererCount = 3
  SignedAnswerers = {1, 2}
  OutsideAnswerers = {1, 3}
  SignatureCheckExists = TRUE
  PlaceCheckExists = TRUE
  CallerCheckExists = TRUE
  ThreadComesFromCaller = TRUE
  ResolutionIsFinal = TRUE
  FailureBlocks = FALSE
  TimeLimitExists = TRUE
INVARIANTS
  AllowOnlyFromUser
  ToolRunsOnlyWithUserAllow
  NoAllowAfterEnd
  RequestShowsInThreadOfItsAgent
CHECK_DEADLOCK FALSE
