\* A control.  It removes the precedence close: Session.waitForOutputRoom
\* waits for a full client even when another viewer keeps up.  TLC must find
\* that NoNewPauseWhileViewerKeepsUp is false.  ClosesBehindFasterViewer is a
\* definition of the model, and this file replaces it.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 3
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {1}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {2}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
  ClosesBehindFasterViewer = FALSE
PROPERTY NoNewPauseWhileViewerKeepsUp
CHECK_DEADLOCK FALSE
