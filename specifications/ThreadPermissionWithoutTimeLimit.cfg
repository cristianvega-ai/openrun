\* A control.  A request has no time limit, so the user can leave it with no
\* answer for ever.  TLC must find that EveryRequestEnds is violated.
SPECIFICATION LiveSpecification
CONSTANTS
  RequestCount = 3
  ThreadCount = 2
  GenuineRequests = {1, 2}
  LyingRequests = {2}
  AnswererCount = 3
  SignedAnswerers = {1, 2}
  OutsideAnswerers = {1, 3}
  SignatureCheckExists = TRUE
  PlaceCheckExists = TRUE
  CallerCheckExists = TRUE
  ThreadComesFromCaller = TRUE
  ResolutionIsFinal = TRUE
  FailureBlocks = TRUE
  TimeLimitExists = FALSE
INVARIANTS
  AllowOnlyFromUser
  ToolRunsOnlyWithUserAllow
  NoAllowAfterEnd
  RequestShowsInThreadOfItsAgent
PROPERTIES
  EveryRequestEnds
CHECK_DEADLOCK FALSE
