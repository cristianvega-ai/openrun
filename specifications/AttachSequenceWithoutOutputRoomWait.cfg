\* A control.  It removes the output-room wait: Session.run goes on after it
\* fans output out to a client that asked for room.  That client then holds
\* more output than the high mark.  TLC must find that OutputWaitBoundsQueue
\* is false.  PausesForRoom is a definition of the model, and this file
\* replaces it.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 3
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {1}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {2}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
  PausesForRoom = FALSE
INVARIANT OutputWaitBoundsQueue
CHECK_DEADLOCK FALSE
