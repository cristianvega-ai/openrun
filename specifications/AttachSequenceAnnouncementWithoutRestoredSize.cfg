\* A control that shows the announcement.  It removes the protection that puts
\* the old size back when the snapshot capture throws.  Another client is
\* already attached and has asked for size changes.  TLC must find that
\* NoRefusedAnnouncement is false, with a sizeChanged queued for that other
\* client.  The code has the protection, so AttachSequence.cfg passes.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 2
  OutputLimit = 2
  ResizeLimit = 0
  RestoreFailedSize = FALSE
  RelayingClients = {1}
  SizeSubscribers = {1, 2}
  QueryChunks = {2}
INVARIANTS
  NoRefusedAnnouncement
CHECK_DEADLOCK FALSE
