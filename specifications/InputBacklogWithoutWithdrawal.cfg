\* A control.  It removes the protection of InputBacklog.withdraw, so the
\* input of a client that left stays in the backlog.  TLC must find that
\* NoByteAfterWithdraw is false: a typed byte of a client that left arrives
\* at the program after it left.  The code has the protection, so
\* InputBacklog.cfg passes.
SPECIFICATION Specification
CONSTANTS
  OwnerCount = 2
  ByteLimit = 2
  MaximumTypedPerOwner = 2
  AnswerCount = 2
  WithdrawalEnabled = FALSE
INVARIANTS
  OwnerOrder
  NoByteAfterWithdraw
  RepliesKeepPlace
  BacklogWithinLimit
CHECK_DEADLOCK FALSE
