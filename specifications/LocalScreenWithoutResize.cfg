\* A control.  It removes the protection that resizes the local terminal when
\* the window changes, so only the session gets the new size.  TLC must find
\* that LocalCopyMatchesWindow is false: the local terminal has the old size
\* while the window has a new one.  The code has the protection, so
\* LocalScreen.cfg passes.
SPECIFICATION Specification
CONSTANTS LocalScreenFollowsWindow = FALSE
INVARIANTS LocalCopyMatchesWindow
CHECK_DEADLOCK FALSE
