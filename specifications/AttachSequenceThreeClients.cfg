\* The code, with 3 clients, 4 chunks, an output limit of 3 and two resizes.
\* One client relays, and two ask for size changes.  TLC must find no
\* violation.  This run is long: about 8 minutes on the owner's Mac.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 3
  ChunkCount = 4
  OutputLimit = 3
  ResizeLimit = 2
  RestoreFailedSize = TRUE
  RelayingClients = {2}
  SizeSubscribers = {1, 3}
  ConfirmingClients = {1}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2, 4}
INVARIANTS
  ServerCapacity
  OutputWaitIsValid
  OutputWaitBoundsQueue
  NoPauseWhileViewerKeepsUp
  NoGapNoRepeat
  NoRefusedSize
  NoRefusedAnnouncement
  SizeOrder
  ConfirmedSizeAgreement
  ReplyGate
  SingleReply
  ReplyOwnership
PROPERTY NoNewPauseWhileViewerKeepsUp
CHECK_DEADLOCK FALSE
\* Closed clients cannot affect a later state.
VIEW SafetyView
