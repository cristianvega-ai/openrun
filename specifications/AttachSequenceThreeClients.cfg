\* The code, with 3 clients, 4 chunks, an output limit of 3 and two resizes.
\* One client relays, and two ask for size changes.  TLC must find no
\* violation.  This run is long, about 16 minutes.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 3
  ChunkCount = 4
  OutputLimit = 3
  ResizeLimit = 2
  RestoreFailedSize = TRUE
  RelayingClients = {2}
  SizeSubscribers = {1, 3}
  QueryChunks = {2, 4}
INVARIANTS
  NoGapNoRepeat
  NoRefusedSize
  NoRefusedAnnouncement
  SizeOrder
  ReplyGate
  SingleReply
  ReplyOwnership
CHECK_DEADLOCK FALSE
