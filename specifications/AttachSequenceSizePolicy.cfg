\* The code, with the size policy and two clients that ask for size changes
\* and can resize.  No output laid out for a new size may reach a client
\* before the message that tells it of that size.  TLC must find no violation.
SPECIFICATION Specification
CONSTANTS
  ClientCount = 2
  ChunkCount = 4
  OutputLimit = 2
  ResizeLimit = 3
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 2}
  QueryChunks = {2, 4}
INVARIANTS
  NoGapNoRepeat
  NoRefusedSize
  NoRefusedAnnouncement
  SizeOrder
  ReplyGate
  SingleReply
  ReplyOwnership
CHECK_DEADLOCK FALSE
