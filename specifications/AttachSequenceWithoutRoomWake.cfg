\* A control.  It removes the wake on the waiter's own room: a client that
\* drains its queue does not end its wait.  The fairness has no timeout, so
\* TLC must find that WaitingForRoomEnds is false.  TLC does not name the
\* temporal property that fails, so this file checks only this one.
\* WakesOnOwnRoom is a definition of the model, and this file replaces it.
SPECIFICATION LiveSpecification
CONSTANTS
  ClientCount = 2
  ChunkCount = 2
  OutputLimit = 2
  ResizeLimit = 1
  RestoreFailedSize = TRUE
  RelayingClients = {}
  SizeSubscribers = {1, 2}
  ConfirmingClients = {1, 2}
  ConfirmResizes = TRUE
  ApplySizeBeforeConfirmation = FALSE
  QueryChunks = {2}
  WakesOnOwnRoom = FALSE
PROPERTY WaitingForRoomEnds
CHECK_DEADLOCK FALSE
