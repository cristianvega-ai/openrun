\* A control.  A question stays out when its last answerer leaves.  TLC must
\* find that WaitingQuestionsHaveAnAnswerer is false.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = TRUE
  AnswerNamesQuestion = TRUE
  ResolutionIsFinal = TRUE
  WithdrawOnLeave = TRUE
  UnknownCallerRefused = TRUE
  DenyWithoutAnswerer = FALSE
  TimeLimitExists = TRUE
INVARIANTS
  WaitingQuestionsHaveAnAnswerer
CHECK_DEADLOCK FALSE
