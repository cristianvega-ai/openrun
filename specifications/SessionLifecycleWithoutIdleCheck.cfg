\* A control.  It removes the second check of closeWhenIdle.  The server saw
\* no client, and while the registry answers, a client connects and starts a
\* session.  The idle exit then ends that session.  TLC must find that
\* IdleExitEndsNoSession is false.  The code checks again, so
\* SessionLifecycleIdleExit.cfg passes.
SPECIFICATION Specification
CONSTANTS
  SessionCount = 1
  ClientCount = 2
  StoppingStateExists = TRUE
  LaunchAgent = TRUE
  IdleCheckExists = FALSE
INVARIANTS
  NoSessionStartsDuringShutdown
  StatusAnsweredAtMostOnce
  LiveSessionsHavePrograms
  IdleExitEndsNoSession
CHECK_DEADLOCK FALSE
