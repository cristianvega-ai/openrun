\* The code.  Request 1 is of the agent of thread 1.  Request 2 is of the agent of
\* thread 2, and its message names thread 1.  Request 3 is of an impostor.
\* Answerer 1 is the signed app outside every session and thread.  Answerer 2
\* is a signed app that an agent started.  Answerer 3 has no signature.
\* TLC must find no violation.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 3
  ThreadCount = 2
  GenuineRequests = {1, 2}
  LyingRequests = {2}
  AnswererCount = 3
  SignedAnswerers = {1, 2}
  OutsideAnswerers = {1, 3}
  SignatureCheckExists = TRUE
  PlaceCheckExists = TRUE
  CallerCheckExists = TRUE
  ThreadComesFromCaller = TRUE
  ResolutionIsFinal = TRUE
  FailureBlocks = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  AllowOnlyFromUser
  ToolRunsOnlyWithUserAllow
  NoAllowAfterEnd
  RequestShowsInThreadOfItsAgent
CHECK_DEADLOCK FALSE
