\* A control.  A question stays out after its caller left, and a later allow
\* performs it.  TLC must find that NoAllowForGoneCaller is false.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = TRUE
  AnswerNamesQuestion = TRUE
  ResolutionIsFinal = TRUE
  WithdrawOnLeave = FALSE
  UnknownCallerRefused = TRUE
  DenyWithoutAnswerer = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  NoAllowForGoneCaller
CHECK_DEADLOCK FALSE
