\* A control.  A caller that ended before the session process found its
\* session counts as a caller outside every session, and its request is
\* performed with no question.  TLC must find that PerformedOnlyWithAllow is
\* false.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = TRUE
  AnswerNamesQuestion = TRUE
  ResolutionIsFinal = TRUE
  WithdrawOnLeave = TRUE
  UnknownCallerRefused = FALSE
  DenyWithoutAnswerer = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  PerformedOnlyWithAllow
CHECK_DEADLOCK FALSE
