\* The code, checked for liveness.  Every send settles once: the backlog takes
\* it, or it fails when the program ends.  TLC must find no violation.
SPECIFICATION LiveSpecification
CONSTANTS
  OwnerCount = 2
  ByteLimit = 2
  MaximumTypedPerOwner = 2
  AnswerCount = 2
  WithdrawalEnabled = TRUE
INVARIANTS
  OwnerOrder
  NoByteAfterWithdraw
  RepliesKeepPlace
  BacklogWithinLimit
PROPERTIES
  EverySendSettles
CHECK_DEADLOCK FALSE
