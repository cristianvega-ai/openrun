\* A control.  A question that ended at its time limit still takes a late
\* allow.  TLC must find that NoAllowAfterDenial is false.
SPECIFICATION Specification
CONSTANTS
  RequestCount = 2
  AnswererCount = 2
  SignedAnswerers = {1}
  SignatureCheckExists = TRUE
  AnswerNamesQuestion = TRUE
  ResolutionIsFinal = FALSE
  WithdrawOnLeave = TRUE
  UnknownCallerRefused = TRUE
  DenyWithoutAnswerer = TRUE
  TimeLimitExists = TRUE
INVARIANTS
  NoAllowAfterDenial
CHECK_DEADLOCK FALSE
