# cargo-about configuration for generating third-party license attribution.
#
# The accepted license list must stay in sync with deny.toml's [licenses.allow].
# CI enforces this via script/check_license_config_sync.

# OpenRun ships for macOS only: crates that only the Windows, Linux or wasm builds of third-party
# dependencies pull in (windows-sys, inotify, wasm-bindgen, ...) are not part of the distribution
# and are not listed in the third-party licenses.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Exclude private workspace crates (publish = false).
private = { ignore = true }

# Build and dev dependencies are not redistributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Built-in workarounds for crates with complicated license packaging.
workarounds = [
    "ring",
    "rustls",
]

# Third-party crates fetched from git repositories in the warpdotdev GitHub organization (forks and
# Warp-authored dependencies) that carry no license metadata cargo-about can read. cargo-about skips
# them during generation. Add --fail back to the generate invocation once they declare licenses.
#
# Crates skipped this way, matching the git sources in Cargo.lock:
#   - command-corrections
#   - warp-command-signatures
#   - warp-workflows
#   - warp-workflows-types
