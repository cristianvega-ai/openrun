# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# A pull request runs the whole CI workflow on hosted macOS runners, and a public repository has five
# of them at a time, so GitHub Actions updates come as one grouped pull request per week, at most two
# open. Cargo gets security updates only.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only send security updates, not general version updates: no routine dependency churn.
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    cooldown:
      # Don't update to any action release that is less than two weeks old.
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
