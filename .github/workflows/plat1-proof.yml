name: PLAT-1 proof

# Temporary: proves script/offline_sandbox_macos and `offline_audit --net-log` on a hosted macOS
# runner. Started by hand; removed when PLAT-2 moves the offline audit job to macOS.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: Run the unit tests in the sandbox
        default: true
        type: boolean
      integration:
        description: Run the integration tests in the sandbox
        default: true
        type: boolean
      idle:
        description: Run the 2-minute idle session in the sandbox
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  # Same job id as the Security tests job in ci.yml, so rust-cache restores its build.
  macos-security-tests:
    name: Proof (macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: "false"

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: The runner
        run: |
          sw_vers
          id
          who || true
          echo "console user: $(stat -f%Su /dev/console)"
          /usr/bin/sandbox-exec -n no-network /usr/bin/true && echo "sandbox-exec works"
          zsh --version; bash --version | head -1

      # Can the denials be read after the run (`log show`), with and without sudo?
      - name: Probe - read denials with log show
        run: |
          start=$(date "+%Y-%m-%d %H:%M:%S")
          cat > probe.py << 'EOF'
          import socket
          c = socket.socket()
          c.settimeout(2)
          try:
              c.connect(("203.0.113.7", 443))
          except OSError as error:
              print("failed:", error)
          EOF
          ./script/offline_sandbox_macos net-probe.log /usr/bin/python3 probe.py
          sleep 10
          echo "--- sudo -n true: $(sudo -n true && echo yes || echo no)"
          echo "--- log show (no sudo)"
          /usr/bin/log show --start "$start" --info --debug --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "network-outbound"' 2>&1 | grep -E "Python|network-outbound" | head -5 || true
          echo "--- log show (sudo)"
          sudo -n /usr/bin/log show --start "$start" --info --debug --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "network-outbound"' 2>&1 | grep -E "Python|network-outbound" | head -5 || true
          echo "--- stream log"
          grep -E "Python|dropped" net-probe.log | head -5 || true

      # What the sandbox log holds when nothing of ours runs: the denials of system processes.
      - name: Measure the log noise of the runner (90 s, nothing running)
        run: |
          ./script/offline_sandbox_macos net-noise.log sleep 90
          grep -E "deny\(1\) (network-outbound|mach-lookup com.apple.(dnssd|nsurlsessiond))" net-noise.log | sed -E 's/^.*Sandbox: (.*)\([0-9]+\) deny\(1\) /\1 | /' | sort | uniq -c | sort -rn | head -40 || true
          python3 ./script/offline_audit --net-log net-noise.log || true

      - name: Canaries - each must be caught
        run: |
          set -u
          cat > canary_dns.py << 'EOF'
          import socket
          try:
              socket.getaddrinfo("example.com", 80)
              print("resolved")
          except OSError as error:
              print("lookup failed:", error)
          EOF
          cat > canary_udp.py << 'EOF'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          try:
              s.sendto(b"canary", ("203.0.113.7", 53))
              print("sent")
          except OSError as error:
              print("send failed:", error)
          EOF
          ./script/offline_sandbox_macos net-canary-tcp.log /usr/bin/curl -s -m 3 -o /dev/null https://203.0.113.7/ || true
          ./script/offline_sandbox_macos net-canary-udp.log /usr/bin/python3 canary_udp.py
          ./script/offline_sandbox_macos net-canary-dns.log /usr/bin/python3 canary_dns.py
          ./script/offline_sandbox_macos net-canary-loopback.log /usr/bin/curl -s -m 3 -o /dev/null http://127.0.0.1:9/ || true
          failed=0
          for log in net-canary-tcp.log net-canary-udp.log net-canary-dns.log; do
            if python3 ./script/offline_audit --net-log "$log"; then
              echo "::error::the recorded-connections check did not flag the canary in $log"
              failed=1
            fi
          done
          if ! python3 ./script/offline_audit --net-log net-canary-loopback.log; then
            echo "::error::a connection to the loopback address was flagged"
            failed=1
          fi
          exit "$failed"

      - name: Build the tests
        run: cargo nextest run --locked --workspace --no-run

      # Is the integration harness usable on this runner at all (a GUI session)?
      - name: Integration harness without the sandbox (two tests)
        run: |
          cargo nextest run --locked --workspace --offline --retries 0 --no-fail-fast \
            -E 'test(=shell_integration_tests::test_executable_completions) | test(=ui_tests::test_focus_panes_on_hover)'

      - name: Unit tests in the sandbox
        if: ${{ !cancelled() && inputs.unit }}
        run: |
          ./script/offline_sandbox_macos net-unit.log \
            cargo nextest run --locked --workspace --offline --retries 0 --no-fail-fast \
              -E 'not package(integration)'

      - name: Integration tests in the sandbox
        if: ${{ !cancelled() && inputs.integration }}
        run: |
          ./script/offline_sandbox_macos net-integration.log \
            cargo nextest run --locked --workspace --offline --retries 0 --no-fail-fast \
              -E 'package(integration)'

      - name: Idle session in the sandbox
        if: ${{ !cancelled() && inputs.idle }}
        run: |
          ./script/offline_sandbox_macos net-idle.log \
            cargo nextest run --locked --workspace --offline --retries 0 --no-fail-fast \
              --run-ignored only -E 'test(~test_idle_session)'

      - name: Check the recorded connections
        if: ${{ !cancelled() }}
        run: |
          logs=$(ls net-unit.log net-integration.log net-idle.log 2> /dev/null || true)
          echo "logs: $logs"
          python3 ./script/offline_audit --net-log $logs

      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: net-logs-macos
          path: net-*.log
          retention-days: 14
          if-no-files-found: ignore
