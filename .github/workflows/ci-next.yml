name: CI next

# The CI pipeline of the CI-SPEED work, run by hand until it replaces ci.yml.
#
# OpenRun runs on macOS only, so every job runs on a hosted macOS runner (Apple silicon). A public
# repository has five of them at a time, which shapes the job graph:
#
#   fmt, audit, clippy      start together with `build` (none of them needs the tests)
#   build                   compiles every test once and makes one nextest archive
#   after the build         unit (sandboxed), security (plain), integration 1-3 (sandboxed), idle
#                           (sandboxed) and shells (plain) start from the archive
#   result                  checks that the jobs together ran every test
#
# The tests run from the archive (script/ci_nextest) in the checkout the archive was built in.
on:
  workflow_dispatch:
    inputs:
      cache:
        description: Restore and save the build cache (turn off to measure a cold build)
        default: true
        type: boolean
      integration_threads_required:
        description: Weight of one integration test in nextest slots (3 cores; the repository default is 2)
        default: "2"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  # The integration tests are split over this many jobs by test name (nextest --partition hash).
  # Keep it in step with the `shard` lists of the integration jobs.
  INTEGRATION_SHARDS: "3"

jobs:
  fmt:
    name: Formatting
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Check formatting
        run: ./script/format --check

  clippy:
    name: Clippy (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/rust-macos
        with:
          tools: ""

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets --tests -- -D warnings

  # Fails when the tree or the dependency graph reaches for Warp-owned hosts or any non-local
  # address. It needs no build. The sandboxed test runs below check the other half: what the
  # tests and the app do at run time.
  #
  # Known RUSTSEC advisories in Cargo.lock (unmaintained crates and a few vulnerabilities in
  # transitive dependencies, all older than this fork) are deliberately not part of this job:
  # `cargo deny check advisories` fails on them and the dependency versions are not ours to bump
  # here. Only `bans licenses sources` run below. CHANGES.md ("Offline guardrails") lists them.
  audit:
    name: Offline audit, static (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install ripgrep
        run: |
          if ! command -v rg > /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ripgrep
          fi

      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
          tools: cargo-deny

      # The static audit reads the sources of git dependencies (found with `cargo metadata`). Fetch
      # them first so it does not depend on a cached build; it skips build-generated directories.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # Greps for Warp hosts and services, network-capable code outside its allowed consumers
      # (including the sources of git dependencies and the completion generator classification),
      # banned crates and `cargo deny check bans licenses sources`. Exceptions are listed, with
      # reasons, in script/offline_audit.allowlist.
      - name: Static audit
        run: ./script/offline_audit --summary

      # Runs the audit's checks against fixture trees: every prohibited construct must be found
      # and every reviewed one accepted, so a loosened pattern or allowlist entry fails here.
      - name: Audit self-test
        run: ./script/offline_audit --self-test

  # Compiles every test of the workspace once. The jobs below run the tests from the archive, so
  # the build, which is most of the time of a run, is not repeated in each of them.
  #
  # The build cache holds the whole `target/` directory, workspace crates and incremental
  # compilation state included. Cargo decides by modification times whether a workspace crate is
  # up to date, and a fresh checkout gives every file a new one, so script/ci_restore_mtimes first
  # puts the recorded times back on the files that did not change.
  build:
    name: Build tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/rust-macos

      # Artifacts of another operating system or architecture are of no use. Bump the version to
      # start a new cache.
      - name: Name the build cache
        run: echo "CACHE_PREFIX=build-v1-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_ENV"

      - name: Restore the build cache
        id: cache
        if: ${{ inputs.cache }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ env.CACHE_PREFIX }}-

      - name: Put the recorded times back on the files that did not change
        if: ${{ steps.cache.outputs.cache-hit != '' }}
        run: python3 script/ci_restore_mtimes apply target/ci-source-manifest.txt

      - name: Build the tests
        run: |
          mkdir -p "$RUNNER_TEMP/test-archive"
          cargo nextest archive --locked --workspace --archive-file "$RUNNER_TEMP/test-archive/tests.tar.zst"

      # Every test of the build, for the coverage check of the `result` job.
      - name: List the tests
        run: |
          mkdir -p "$RUNNER_TEMP/tests-list"
          cargo nextest list --locked --workspace --message-format json > "$RUNNER_TEMP/tests-list/tests-list.json"
          (cd "$GITHUB_WORKSPACE" && pwd -P) > "$RUNNER_TEMP/test-archive/workspace-path.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-archive
          path: ${{ runner.temp }}/test-archive
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-list
          path: ${{ runner.temp }}/tests-list
          retention-days: 3

      - name: Record the sources this build was made from
        run: |
          python3 script/ci_restore_mtimes write target/ci-source-manifest.txt
          rm -rf target/nextest target/debug/examples
          du -sh target target/debug/incremental target/debug/deps target/debug/build 2>/dev/null || true

      - name: Save the build cache
        if: ${{ inputs.cache && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ env.CACHE_PREFIX }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}

  # Every test except the `integration` package, in the network sandbox. The modules that test the
  # sandbox itself (`network_sandbox`) and the offline environment of real tools cannot run inside
  # a sandbox (a second one cannot be applied); the Security tests job runs them.
  #
  # The whole test process tree runs in one sandbox profile, so the app runs the commands of its
  # completion generators directly (see network_sandbox.rs; only test and integration-test
  # builds read this variable).
  unit:
    name: Unit tests (macOS, network sandbox)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      WARP_NETWORK_SANDBOX_BY_PARENT: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
      - uses: ./.github/actions/macos-test-tools
      - uses: ./.github/actions/test-archive
      - uses: ./.github/actions/offline-canary

      # Unit tests may spawn a shell but don't depend on which one. The runner's login shell is
      # bash 3.2; some tests assume the shell of a developer's Mac, zsh.
      - name: Run the unit tests in the network sandbox
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-unit.log \
            ./script/ci_nextest sandboxed-unit --no-fail-fast \
              -E 'not package(integration) and not test(~command_executor::network_sandbox) and not test(~command_executor::offline_environment)'

      - uses: ./.github/actions/offline-check
        if: ${{ !cancelled() }}
        with:
          name: unit
          logs: net-unit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: junit-unit
          path: junit
          if-no-files-found: error

  # The command executor tests for the macOS sandbox (`sandbox-exec` profile, the DNS daemon and
  # background URL session canaries), the offline environment, the restored completion
  # generators and the generator policy with its injection corpus. They run outside the network
  # sandbox, on purpose: they apply sandboxes of their own, and they exercise the production
  # path, where every completion command is wrapped in `sandbox-exec`. The tests that use real
  # tools (git, npm, corepack, rustup, docker, python3, fish, pwsh) fail instead of skipping when
  # a tool is missing and `CI=true`, which GitHub Actions sets, so the tools are installed or
  # checked first.
  security:
    name: Security tests (macOS)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
      - uses: ./.github/actions/macos-test-tools
      - uses: ./.github/actions/test-archive

      - name: Run the command executor security tests
        run: |
          ./script/ci_nextest plain-security --no-fail-fast \
            -E '(package(warp) and test(~terminal::model::session::command_executor)) | (package(warp_completer) and test(~generator_policy))'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: junit-security
          path: junit
          if-no-files-found: error

  # The `integration` package starts the full app (real AppKit windows and Metal) and a shell in
  # a pty for each test. A hosted macOS runner has a logged-in GUI session, so no virtual display
  # is needed. The tests are split over INTEGRATION_SHARDS jobs by test name; every job runs in
  # the network sandbox.
  integration:
    name: Integration tests ${{ matrix.shard }} (macOS, network sandbox)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WARP_NETWORK_SANDBOX_BY_PARENT: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
      - uses: ./.github/actions/macos-test-tools
      - uses: ./.github/actions/test-archive
      - uses: ./.github/actions/offline-canary

      - name: Set the weight of an integration test
        if: ${{ inputs.integration_threads_required != '2' }}
        env:
          THREADS_REQUIRED: ${{ inputs.integration_threads_required }}
        run: sed -i '' "s/^threads-required = 2$/threads-required = $THREADS_REQUIRED/" .config/nextest.toml

      - name: Run integration tests ${{ matrix.shard }} of ${{ env.INTEGRATION_SHARDS }} in the network sandbox
        run: |
          if [ "${{ strategy.job-total }}" != "$INTEGRATION_SHARDS" ]; then
            echo "::error::the shard list has ${{ strategy.job-total }} entries but INTEGRATION_SHARDS is $INTEGRATION_SHARDS: tests would not run"
            exit 1
          fi
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-integration-${{ matrix.shard }}.log \
            ./script/ci_nextest sandboxed-integration-${{ matrix.shard }} --no-fail-fast \
              --partition hash:${{ matrix.shard }}/${{ env.INTEGRATION_SHARDS }} -E 'package(integration)'

      - uses: ./.github/actions/offline-check
        if: ${{ !cancelled() }}
        with:
          name: integration-${{ matrix.shard }}
          logs: net-integration-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: junit-integration-${{ matrix.shard }}
          path: junit
          if-no-files-found: error

  # Boots the app and leaves it idle for two minutes in the same kind of sandbox, so periodic
  # timers (flushes, polling, update checks) get a chance to reach out. The test is ignored in
  # the regular run because of its length.
  idle:
    name: Idle session (macOS, network sandbox)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      WARP_NETWORK_SANDBOX_BY_PARENT: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
      - uses: ./.github/actions/macos-test-tools
      - uses: ./.github/actions/test-archive
      - uses: ./.github/actions/offline-canary

      - name: Run an idle session in the network sandbox
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-idle.log \
            ./script/ci_nextest sandboxed-idle --no-fail-fast \
              --run-ignored only -E 'test(~test_idle_session)'

      - uses: ./.github/actions/offline-check
        if: ${{ !cancelled() }}
        with:
          name: idle
          logs: net-idle.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: junit-idle
          path: junit
          if-no-files-found: error

  # A short selection of integration tests outside the network sandbox, with the shells the
  # sandboxed runs do not use (they all run zsh):
  #  - the production path: every completion command of the app is wrapped in `sandbox-exec`, and
  #    the sandboxed runs skip that wrapper (WARP_NETWORK_SANDBOX_BY_PARENT), so the sessions that
  #    list executables and complete commands run here without the switch;
  #  - the bash that macOS ships (3.2) and Homebrew's bash (5.x) as the session's shell.
  shells:
    name: Shell tests (macOS, zsh and bash)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # Bootstrap and completions: the sessions whose startup runs commands through the wrapper.
      CORE_TESTS: >-
        test(=shell_integration_tests::test_bootstrap_with_no_script_execution_block) |
        test(=shell_integration_tests::test_executable_completions) |
        test(=shell_integration_tests::test_builtin_completions) |
        test(=shell_integration_tests::test_function_completions) |
        test(=shell_integration_tests::test_keyword_completions) |
        test(=shell_integration_tests::test_single_command) |
        test(=shell_integration_tests::test_typeahead) |
        test(=shell_integration_tests::test_ctrl_c) |
        test(=shell_integration_tests::test_background_output) |
        test(=shell_integration_tests::test_histcontrol_env_var) |
        test(=shell_integration_tests::test_osc7_updates_current_working_directory) |
        test(=shell_integration_tests::test_rc_files_only_sourced_once_during_bootstrapping) |
        test(=shell_integration_tests::test_input_reporting_posix_shells) |
        test(=shell_integration_tests::test_start_shell_in_deleted_directory) |
        test(=shell_integration_tests::test_auto_title)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
      - uses: ./.github/actions/macos-test-tools
      - uses: ./.github/actions/test-archive

      - name: Install Homebrew's bash
        run: |
          if [ ! -x "$(brew --prefix)/bin/bash" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash
          fi
          "$(brew --prefix)/bin/bash" --version | head -1

      - name: Run the core sessions with zsh
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/ci_nextest plain-shells-zsh --no-fail-fast -E "package(integration) and ($CORE_TESTS | test(=shell_integration_tests::test_can_bootstrap_local_zsh_subshell))"

      - name: Run the bash sessions with the bash of macOS (3.2)
        run: |
          WARP_SHELL_PATH=/bin/bash
          export WARP_SHELL_PATH
          /bin/bash --version | head -1
          ./script/ci_nextest plain-shells-bash32 --no-fail-fast -E "package(integration) and ($CORE_TESTS | test(~shell_integration_tests::test_bash) | test(=shell_integration_tests::test_can_bootstrap_local_bash_subshell) | test(=shell_integration_tests::test_custom_ps1_expansion_bash) | test(=shell_integration_tests::test_warp_honors_user_title_bash))"

      - name: Run the bash sessions with Homebrew's bash
        run: |
          WARP_SHELL_PATH="$(brew --prefix)/bin/bash"
          export WARP_SHELL_PATH
          ./script/ci_nextest plain-shells-bash5 --no-fail-fast -E "package(integration) and ($CORE_TESTS | test(~shell_integration_tests::test_bash) | test(=shell_integration_tests::test_can_bootstrap_local_bash_subshell) | test(=shell_integration_tests::test_custom_ps1_expansion_bash) | test(=shell_integration_tests::test_warp_honors_user_title_bash))"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: junit-shells
          path: junit
          if-no-files-found: error

  # The single result of the workflow: it fails unless every job succeeded and the jobs together
  # ran every test (script/ci_check_coverage).
  result:
    name: CI result
    needs: [fmt, clippy, audit, build, unit, security, integration, idle, shells]
    if: ${{ always() }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          for name, job in sorted(needs.items()):
              print(f"{name}: {job['result']}")
          if bad:
              sys.exit("jobs that did not succeed: " + ", ".join(f"{n} ({r})" for n, r in sorted(bad.items())))
          PY

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tests-list
          path: tests-list

      - name: Check that the jobs together ran every test
        run: |
          ./script/ci_check_coverage --list tests-list/tests-list.json --reports junit \
            --plain-only 'command_executor::(network_sandbox|offline_environment)' \
            --must-run-ignored test_idle_session
