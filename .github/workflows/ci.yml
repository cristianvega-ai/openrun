name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled by a newer push. A run on `main` finishes, so
  # every commit that lands there gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  # Development headers and tools needed to compile the workspace on Ubuntu. Mirrors
  # script/linux/install_build_deps, minus the packaging-only tools.
  LINUX_BUILD_PACKAGES: >-
    build-essential cmake pkg-config protobuf-compiler libclang-dev
    libssl-dev libfreetype-dev libexpat1-dev libgit2-dev libfontconfig1-dev
  # Shells and runtime libraries that unit tests load. Mirrors script/linux/install_runtime_deps
  # and script/linux/install_test_deps.
  LINUX_TEST_PACKAGES: >-
    zsh fish fontconfig
    libx11-6 libxcb1 libxi6 libxcursor1 libxkbcommon-x11-0
    libwayland-client0 libwayland-egl1 libegl1 mesa-vulkan-drivers

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Check formatting
        run: ./script/format --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package list is meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package lists are meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES $LINUX_TEST_PACKAGES

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      # Unit tests may spawn a shell but don't depend on which one. zsh has the shortest
      # bootstrap time.
      - name: Use zsh for tests that spawn a shell
        run: echo "WARP_SHELL_PATH=$(command -v zsh)" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: cargo nextest run --locked --workspace -E 'not package(integration)'

  # Fails when the tree, the dependency graph or a sandboxed test run reaches for Warp-owned
  # hosts or any non-loopback address. It blocks merges.
  #
  # Known RUSTSEC advisories in Cargo.lock (unmaintained crates and a few vulnerabilities in
  # transitive dependencies, all older than this fork) are deliberately not part of this job:
  # `cargo deny check advisories` fails on them and the dependency versions are not ours to bump
  # here. Only `bans licenses sources` run below. CHANGES.md ("Offline guardrails") lists them.
  offline-audit:
    name: Offline audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package lists are meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES $LINUX_TEST_PACKAGES \
            ripgrep strace xvfb iproute2

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest,cargo-deny

      # The static audit reads the sources of git dependencies (found with `cargo metadata`). Fetch
      # them first so it does not depend on a cached build; it skips build-generated directories.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # Greps for Warp hosts and services, network-capable code outside its allowed consumers
      # (including the sources of git dependencies and the completion generator classification),
      # banned crates and `cargo deny check bans licenses sources`. Exceptions are listed, with
      # reasons, in script/offline_audit.allowlist.
      - name: Static audit
        run: ./script/offline_audit --summary

      # Runs the audit's checks against fixture trees: every prohibited construct must be found
      # and every reviewed one accepted, so a loosened pattern or allowlist entry fails here.
      - name: Audit self-test
        run: ./script/offline_audit --self-test

      - name: Build the tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --workspace --no-run

      # Ubuntu 24.04 blocks unprivileged user namespaces by default.
      - name: Allow unprivileged user namespaces
        if: ${{ !cancelled() }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Runs every test, including the `integration` package that boots the full app, in a network
      # namespace with only a loopback interface while strace records each connect and send.
      - name: Run the tests in a network sandbox
        if: ${{ !cancelled() }}
        run: |
          unshare --user --map-root-user --net sh -c '
            ip link set lo up
            strace -f -qq -e trace=connect,sendto,sendmsg,sendmmsg -o net.log \
              xvfb-run -a cargo nextest run --locked --workspace --offline --no-fail-fast
          '

      - name: Check the recorded connections
        if: ${{ !cancelled() }}
        run: ./script/offline_audit --net-log net.log

      # Boots the app and leaves it idle for two minutes in the same kind of sandbox, so periodic
      # timers (flushes, polling, update checks) get a chance to reach out. The test is ignored in
      # the regular run because of its length.
      - name: Run an idle session in a network sandbox
        if: ${{ !cancelled() }}
        run: |
          unshare --user --map-root-user --net sh -c '
            ip link set lo up
            strace -f -qq -e trace=connect,sendto,sendmsg,sendmmsg -o net-idle.log \
              xvfb-run -a cargo nextest run --locked --workspace --offline --no-fail-fast \
                --run-ignored only -E "test(~test_idle_session)"
          '

      - name: Check the connections of the idle session
        if: ${{ !cancelled() }}
        run: ./script/offline_audit --net-log net-idle.log
