name: CI

# OpenRun runs on macOS only, so every job runs on a hosted macOS runner (Apple silicon).
on:
  # A branch with a pull request is built once, for the pull request: both events at once doubled
  # the jobs, and a hosted macOS runner is scarce (5 jobs at a time on the free plan).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled by a newer push. A run on `main` finishes, so
  # every commit that lands there gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  fmt:
    name: Formatting
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Check formatting
        run: ./script/format --check

      # The integration tests have no retry of any kind: a step that fails once fails the test.
      # A retry would turn a race into a green run, so nothing that retries or reruns may return.
      - name: Check that the integration framework has no retries
        run: |
          if grep -rnE 'set_retries|RERUN_EXIT_CODE|PreconditionFailed|set_on_failure_handler' crates app/src --include='*.rs'; then
            echo "::error::the integration framework must not retry or rerun a step or a test"
            exit 1
          fi

  clippy:
    name: Clippy (macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      # crates/warpui/build.rs compiles the Metal shaders with `xcrun metal`. Recent Xcode
      # versions ship the Metal compiler as a separate component.
      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets --tests -- -D warnings

  # Every test except the `integration` package, which boots the full app and has its own job.
  # No retries: a test that fails once and passes on a retry (nextest reports it as FLAKY) is not
  # a pass.
  test:
    name: Unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - uses: ./.github/actions/macos-test-tools

      # Unit tests may spawn a shell but don't depend on which one. The runner's login shell is
      # bash 3.2; some tests assume the shell of a developer's Mac, zsh.
      - name: Run unit tests
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          cargo nextest run --locked --workspace --retries 0 -E 'not package(integration)'

  # The `integration` package starts the full app (real AppKit windows and Metal) and a shell in
  # a pty for each test. A hosted macOS runner has a logged-in GUI session, so no virtual display
  # is needed.
  integration:
    name: Integration tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - uses: ./.github/actions/macos-test-tools

      # A scenario that doesn't apply to the shell of the run exits with its own code and is a
      # skip, not a pass. In CI a skip fails the test unless it is in ALLOWED_CI_SKIPS in
      # crates/integration/tests/common/mod.rs; the tests of one shell (bash_only, pwsh_only) are
      # ignored here and run in the job for their shell below.
      - name: Run the integration tests with zsh
        env:
          OPENRUN_SKIP_REPORT: ${{ runner.temp }}/integration-skips.txt
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          cargo nextest run --locked --workspace --retries 0 --no-fail-fast -E 'package(integration)'

      - name: List the skipped integration scenarios
        if: ${{ always() }}
        env:
          OPENRUN_SKIP_REPORT: ${{ runner.temp }}/integration-skips.txt
        run: |
          {
            echo "### Skipped integration scenarios (zsh)"
            if [ -s "$OPENRUN_SKIP_REPORT" ]; then
              sed 's/^/- /' "$OPENRUN_SKIP_REPORT"
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The scenarios that only exist in one shell (bash, PowerShell 7). They are ignored in the zsh
  # run above, so this job is where they run: every test here must run, and a skip fails it
  # (`CI=true`). The runner ships bash 3.2 and PowerShell 7; bash 5.1 or newer comes from Homebrew.
  integration-shells:
    name: Integration tests, bash and PowerShell (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - uses: ./.github/actions/macos-test-tools

      - name: Install bash 5
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash
          "$(brew --prefix)/bin/bash" --version

      - name: Run the bash scenarios
        run: |
          WARP_SHELL_PATH="$(brew --prefix)/bin/bash"
          export WARP_SHELL_PATH
          cargo nextest run --locked --workspace --retries 0 --no-fail-fast \
            --run-ignored only -E 'package(integration) and test(~shell_integration_tests::bash_only::)'

      - name: Run the PowerShell scenarios
        if: ${{ !cancelled() }}
        run: |
          WARP_SHELL_PATH=$(command -v pwsh)
          export WARP_SHELL_PATH
          cargo nextest run --locked --workspace --retries 0 --no-fail-fast \
            --run-ignored only -E 'package(integration) and test(~shell_integration_tests::pwsh_only::)'

  # The command executor tests for the macOS sandbox (`sandbox-exec` profile, the DNS daemon and
  # background URL session canaries), the offline environment, the restored completion
  # generators and the generator policy with its injection corpus. The tests that use real tools
  # (git, npm, corepack, rustup, docker, python3, fish, pwsh) fail instead of skipping when a tool
  # is missing and `CI=true`, which GitHub Actions sets, so the tools are installed or checked
  # first. The offline audit job leaves the modules that test the sandbox itself out of its
  # sandboxed run (a sandbox cannot be applied twice); they run here.
  macos-security-tests:
    name: Security tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - uses: ./.github/actions/macos-test-tools

      - name: Run the command executor security tests
        run: |
          cargo nextest run --locked --workspace --retries 0 --no-fail-fast \
            -E 'package(warp) and (test(~command_executor::network_sandbox) | test(~command_executor::offline_environment) | test(~command_executor::restored_generators))'

      # The generator policy tests, with the injection corpus: every hostile word is run in bash,
      # zsh, sh, fish and PowerShell 7, and a missing fish or pwsh fails them (`CI=true`).
      - name: Run the generator policy and injection tests in every shell
        run: |
          cargo nextest run --locked --workspace --retries 0 --no-fail-fast \
            -E '(package(warp_completer) and test(~generator_policy)) | (package(warp) and test(~local_command_executor) and test(~session_runs_its_generator_commands))'

  # Fails when the tree, the dependency graph or a sandboxed test run reaches for Warp-owned
  # hosts or any non-local address. It blocks merges.
  #
  # The unit tests, the integration tests and a two-minute idle session run in a network sandbox
  # (script/offline_sandbox_macos): `sandbox-exec` refuses every address that is not on the
  # machine, and the unified log is read for the refusals, which `offline_audit --net-log` turns
  # into a pass or fail.
  #
  # Known RUSTSEC advisories in Cargo.lock (unmaintained crates and a few vulnerabilities in
  # transitive dependencies, all older than this fork) are deliberately not part of this job:
  # `cargo deny check advisories` fails on them and the dependency versions are not ours to bump
  # here. Only `bans licenses sources` run below. CHANGES.md ("Offline guardrails") lists them.
  offline-audit:
    name: Offline audit (macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # The whole test process tree runs in one sandbox profile, and a second one cannot be
      # applied, so the app runs the commands of its completion generators directly (see
      # network_sandbox.rs; only test and integration-test builds read this).
      WARP_NETWORK_SANDBOX_BY_PARENT: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install ripgrep
        run: |
          if ! command -v rg > /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ripgrep
          fi

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest,cargo-deny

      - uses: ./.github/actions/macos-test-tools

      # The static audit reads the sources of git dependencies (found with `cargo metadata`). Fetch
      # them first so it does not depend on a cached build; it skips build-generated directories.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # Greps for Warp hosts and services, network-capable code outside its allowed consumers
      # (including the sources of git dependencies and the completion generator classification),
      # banned crates and `cargo deny check bans licenses sources`. Exceptions are listed, with
      # reasons, in script/offline_audit.allowlist.
      - name: Static audit
        run: ./script/offline_audit --summary

      # Runs the audit's checks against fixture trees: every prohibited construct must be found
      # and every reviewed one accepted, so a loosened pattern or allowlist entry fails here.
      - name: Audit self-test
        run: ./script/offline_audit --self-test

      - name: Build the tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --workspace --no-run

      # The canaries prove that the sandbox and the log check can fail: each sandboxed command makes
      # one access that must be refused (a TCP connection to a documentation address, a datagram to
      # a DNS port, a name lookup), and `offline_audit --net-log` must flag every one. A connection
      # to the loopback address must not be flagged. If the log stops recording (a changed format, a
      # runner image without the reports), this step fails instead of letting an empty log pass as
      # "no connections".
      - name: Check the sandbox catches a connection
        if: ${{ !cancelled() }}
        run: |
          cat > canary_udp.py << 'EOF'
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          try:
              s.sendto(b"canary", ("203.0.113.7", 53))
          except OSError as error:
              print("datagram refused as expected:", error)
          EOF
          cat > canary_dns.py << 'EOF'
          import socket
          try:
              socket.getaddrinfo("example.com", 80)
              print("the name was resolved")
          except OSError as error:
              print("lookup refused as expected:", error)
          EOF
          ./script/offline_sandbox_macos net-canary-tcp.log /usr/bin/curl -s -m 3 -o /dev/null https://203.0.113.7/ || true
          ./script/offline_sandbox_macos net-canary-udp.log /usr/bin/python3 canary_udp.py
          ./script/offline_sandbox_macos net-canary-dns.log /usr/bin/python3 canary_dns.py
          ./script/offline_sandbox_macos net-canary-loopback.log /usr/bin/curl -s -m 3 -o /dev/null http://127.0.0.1:9/ || true
          failed=0
          for log in net-canary-tcp.log net-canary-udp.log net-canary-dns.log; do
            if ./script/offline_audit --net-log "$log"; then
              echo "::error::the recorded-connections check did not flag the canary in $log"
              failed=1
            fi
          done
          if ! ./script/offline_audit --net-log net-canary-loopback.log; then
            echo "::error::a connection to the loopback address was flagged"
            failed=1
          fi
          exit "$failed"

      # Every test except the `integration` package, with zsh as the shell. The modules that test
      # the sandbox itself (`network_sandbox`) and the offline environment of real tools run in the
      # Security tests job: a second sandbox cannot be applied inside this one.
      - name: Run the unit tests in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-unit.log \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
              -E 'not package(integration) and not test(~command_executor::network_sandbox) and not test(~command_executor::offline_environment)'

      - name: Run the integration tests in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-integration.log \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
              -E 'package(integration)'

      # Boots the app and leaves it idle for two minutes in the same kind of sandbox, so periodic
      # timers (flushes, polling, update checks) get a chance to reach out. The test is ignored in
      # the regular run because of its length.
      - name: Run an idle session in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-idle.log \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
              --run-ignored only -E 'test(~test_idle_session)'

      # A missing log fails the check: every log below is written by a step above.
      - name: Check the recorded connections
        if: ${{ !cancelled() }}
        run: ./script/offline_audit --net-log net-unit.log net-integration.log net-idle.log

      # The logs show what was (not) contacted and are the evidence if a check fails.
      - name: Upload the connection logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: net-logs
          path: net-*.log
          retention-days: 14
          if-no-files-found: ignore
