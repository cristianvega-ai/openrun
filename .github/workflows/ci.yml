name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled by a newer push. A run on `main` finishes, so
  # every commit that lands there gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  # Development headers and tools needed to compile the workspace on Ubuntu. Mirrors
  # script/linux/install_build_deps, minus the packaging-only tools.
  LINUX_BUILD_PACKAGES: >-
    build-essential cmake pkg-config protobuf-compiler libclang-dev
    libssl-dev libfreetype-dev libexpat1-dev libgit2-dev libfontconfig1-dev
  # Integration tests that only pass with zsh as the shell. They run in their own step.
  ZSH_ONLY_INTEGRATION_TESTS: >-
    test(=shell_integration_tests::test_git_prompt_chips)
    | test(=ui_tests::test_open_and_close_settings)
    | test(=ui_tests::test_restore_snapshot_with_markdown_file)
    | test(=ui_tests::test_tab_context_menu_copies_metadata)
    | test(=ui_tests::test_vertical_pane_context_menu_copies_metadata)
    | test(=ui_tests::test_vertical_tab_context_menu_copies_metadata)
  # Shells and runtime libraries that unit tests load. Mirrors script/linux/install_runtime_deps
  # and script/linux/install_test_deps.
  LINUX_TEST_PACKAGES: >-
    zsh fish fontconfig
    libx11-6 libxcb1 libxi6 libxcursor1 libxkbcommon-x11-0
    libwayland-client0 libwayland-egl1 libegl1 mesa-vulkan-drivers

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Check formatting
        run: ./script/format --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package list is meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package lists are meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES $LINUX_TEST_PACKAGES

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      # Unit tests may spawn a shell but don't depend on which one. zsh has the shortest
      # bootstrap time.
      - name: Use zsh for tests that spawn a shell
        run: echo "WARP_SHELL_PATH=$(command -v zsh)" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: cargo nextest run --locked --workspace -E 'not package(integration)'

  # Fails when the tree, the dependency graph or a sandboxed test run reaches for Warp-owned
  # hosts or any non-loopback address. It blocks merges.
  #
  # Known RUSTSEC advisories in Cargo.lock (unmaintained crates and a few vulnerabilities in
  # transitive dependencies, all older than this fork) are deliberately not part of this job:
  # `cargo deny check advisories` fails on them and the dependency versions are not ours to bump
  # here. Only `bans licenses sources` run below. CHANGES.md ("Offline guardrails") lists them.
  offline-audit:
    name: Offline audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package lists are meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES $LINUX_TEST_PACKAGES \
            ripgrep strace xvfb iproute2

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest,cargo-deny

      # The static audit reads the sources of git dependencies (found with `cargo metadata`). Fetch
      # them first so it does not depend on a cached build; it skips build-generated directories.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # Greps for Warp hosts and services, network-capable code outside its allowed consumers
      # (including the sources of git dependencies and the completion generator classification),
      # banned crates and `cargo deny check bans licenses sources`. Exceptions are listed, with
      # reasons, in script/offline_audit.allowlist.
      - name: Static audit
        run: ./script/offline_audit --summary

      # Runs the audit's checks against fixture trees: every prohibited construct must be found
      # and every reviewed one accepted, so a loosened pattern or allowlist entry fails here.
      - name: Audit self-test
        run: ./script/offline_audit --self-test

      - name: Build the tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked --workspace --no-run

      # Ubuntu 24.04 blocks unprivileged user namespaces by default.
      - name: Allow unprivileged user namespaces
        if: ${{ !cancelled() }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # script/offline_sandbox runs a command in a network namespace with only a loopback
      # interface while strace records each connect and send (see the script for the details).
      #
      # The canaries prove that the sandbox and the log check can fail: the sandbox makes one real
      # outside connect and sends one datagram to a DNS port, and `offline_audit --net-log` must
      # flag both. If strace stops recording (an unsupported option, a changed log format), this
      # step fails instead of letting an empty log pass as "no connections".
      - name: Check the sandbox catches a connection
        if: ${{ !cancelled() }}
        run: |
          ./script/offline_sandbox net-canary-connect.log python3 -c '
          import socket
          s = socket.socket()
          s.settimeout(2)
          try:
              s.connect(("203.0.113.7", 443))
          except OSError as error:
              print("connect failed as expected:", error)
          '
          ./script/offline_sandbox net-canary-dns.log python3 -c '
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.sendto(b"canary", ("127.0.0.1", 53))
          print("sent a datagram to a DNS port")
          '
          for log in net-canary-connect.log net-canary-dns.log; do
            if ./script/offline_audit --net-log "$log"; then
              echo "::error::the recorded-connections check did not flag the canary in $log"
              cat "$log"
              exit 1
            fi
          done

      # One test that boots the app and bootstraps bash, so a slow or broken sandbox shows up in
      # minutes and not after the whole suite. No retries: it must pass the first time.
      - name: Smoke test the sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          WARP_SHELL_PATH=$(command -v bash)
          export WARP_SHELL_PATH
          ./script/offline_sandbox net-smoke.log xvfb-run -a \
            cargo nextest run --locked --workspace --offline --retries 0 \
              -E "test(~test_bash_bootstraps_with_prompt_command_array)"

      # Every test except the `integration` package, which boots the full app and gets its own
      # steps. Set up like the `Unit tests` job: zsh for tests that spawn a shell and no X server
      # (the Linux clipboard tests skip themselves without a display and fail under xvfb).
      - name: Run the unit tests in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox net-unit.log \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 1 \
              -E "not package(integration)"

      # The app runs `gh` for the pull request of the current branch, and the runner image has a
      # real `gh` (and other cloud CLIs) installed. In the integration tests `gh` looked up its
      # API host, a DNS request from the tool and not from the app. Stubs first in the PATH make
      # those tools fail at once, as they do on a machine where they are not set up.
      - name: Replace the GitHub and cloud CLIs with stubs
        run: |
          stubs="$RUNNER_TEMP/offline-stubs"
          mkdir -p "$stubs"
          for tool in gh kubectl docker podman aws az gcloud gsutil terraform helm doctl; do
            printf '#!/bin/sh\necho "%s: disabled in the offline sandbox" >&2\nexit 1\n' "$tool" > "$stubs/$tool"
            chmod +x "$stubs/$tool"
          done
          echo "$stubs" >> "$GITHUB_PATH"

      # The `integration` package with bash, the shell these steps use everywhere else. One retry
      # instead of the ci profile's two: a test that fails because of the sandbox fails every
      # time, so more retries only burn the time budget. Seven tests are left out and run with zsh
      # in the next step: their expectations (tab title `~`, the git branch chip, scroll layout)
      # do not hold with bash on the runner, with or without the sandbox (a control run outside
      # it failed the same seven; CHANGES.md, "CI: the network-sandbox steps finish").
      - name: Run the integration tests in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        run: |
          WARP_SHELL_PATH=$(command -v bash)
          export WARP_SHELL_PATH
          ./script/offline_sandbox net-integration.log xvfb-run -a \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 1 \
              -E "package(integration) and not ($ZSH_ONLY_INTEGRATION_TESTS | test(=ui_tests::test_waterfall_input_scrolling))"

      - name: Run the zsh integration tests in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox net-integration-zsh.log xvfb-run -a \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 1 --status-level all \
              -E "package(integration) and ($ZSH_ONLY_INTEGRATION_TESTS)"

      # `test_waterfall_input_scrolling` asserts the pixel layout of the input and fails on the
      # runner's virtual screen in both shells, with or without the sandbox (ENG-192). It is not
      # part of the blocking steps; this one tries it on a larger screen and only reports.
      - name: Run the waterfall layout test in a network sandbox
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox net-waterfall.log xvfb-run -a -s "-screen 0 2560x1600x24" \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
              -E "test(=ui_tests::test_waterfall_input_scrolling)"

      - name: Check the recorded connections
        if: ${{ !cancelled() }}
        run: ./script/offline_audit --net-log net-smoke.log net-unit.log net-integration.log net-integration-zsh.log net-waterfall.log

      # Boots the app and leaves it idle for two minutes in the same kind of sandbox, so periodic
      # timers (flushes, polling, update checks) get a chance to reach out. The test is ignored in
      # the regular run because of its length.
      - name: Run an idle session in a network sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          ./script/offline_sandbox net-idle.log xvfb-run -a \
            cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
              --run-ignored only -E "test(~test_idle_session)"

      - name: Check the connections of the idle session
        if: ${{ !cancelled() }}
        run: ./script/offline_audit --net-log net-idle.log

      # A failing connection check names an address; this names the programs that ran, to tell
      # the app from a tool it started.
      - name: List the programs started in the sandbox
        if: ${{ always() }}
        run: |
          cat net-*.log 2>/dev/null | sed -n 's/^[0-9]* execve("\([^"]*\)".*/\1/p' | sort | uniq -c | sort -rn | head -80

      # The logs show what was (not) contacted and are the evidence if a check fails.
      - name: Upload the connection logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: net-logs
          path: net-*.log
          retention-days: 14
          if-no-files-found: ignore
