name: Stress tests

# Runs a nextest filter many times on a hosted macOS runner (3 cores, the machine the CI jobs
# use), to reproduce and measure timing-dependent tests that do not fail on a development machine.
# Started by hand:
#
#   gh workflow run stress.yml -f filter='test(=terminal::view::tests::some_test)' -f count=50
#
# A failing iteration fails the run. The workflow does not run on push, so it never blocks a merge.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: nextest filterset expression, e.g. test(=ui_tests::test_ctrl_c)
        required: true
        type: string
      count:
        description: Number of times to run the selection (nextest --stress-count)
        default: "20"
        type: string
      shell:
        description: Shell the tests start (bash3 is the bash 3.2 of macOS, /bin/bash; bash is the first one on the PATH)
        default: zsh
        type: choice
        options: [zsh, bash, bash3, fish, pwsh]
      run_ignored:
        description: Which ignored tests to run (nextest --run-ignored)
        default: default
        type: choice
        options: [default, all, only]
      rust_log:
        description: RUST_LOG for the tests (empty keeps the default)
        default: ""
        type: string
      ref:
        description: Commit to test, to compare commits with the same workflow (empty tests the one the workflow was started on)
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  # Restores the build of the last push to `main` (the Build tests job of ci.yml saves it), so only
  # what changed since then is compiled.
  test:
    name: Stress
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/rust-macos

      - uses: ./.github/actions/build-cache

      - uses: ./.github/actions/macos-test-tools

      - name: Build the tests
        run: cargo nextest run --locked --workspace --no-run

      - name: Run the selection ${{ inputs.count }} times
        env:
          FILTER: ${{ inputs.filter }}
          COUNT: ${{ inputs.count }}
          SHELL_NAME: ${{ inputs.shell }}
          RUN_IGNORED: ${{ inputs.run_ignored }}
          STRESS_RUST_LOG: ${{ inputs.rust_log }}
        run: |
          if [ "$SHELL_NAME" = bash3 ]; then
            WARP_SHELL_PATH=/bin/bash
          else
            WARP_SHELL_PATH=$(command -v "$SHELL_NAME")
          fi
          export WARP_SHELL_PATH
          echo "tested commit: $(git rev-parse HEAD)"
          echo "shell: $WARP_SHELL_PATH"
          "$WARP_SHELL_PATH" --version | head -1
          if [ -n "$STRESS_RUST_LOG" ]; then
            export RUST_LOG="$STRESS_RUST_LOG"
          fi
          # The bash hooks append the status they saw to this file (bash_body.sh); the next step
          # prints it, so a wrong status in a failure can be told from a wrong reading of it.
          export WARP_HOOK_TRACE_FILE="$RUNNER_TEMP/hook-trace.log"
          : > "$WARP_HOOK_TRACE_FILE"
          cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
            --run-ignored "$RUN_IGNORED" --stress-count "$COUNT" -E "$FILTER" 2>&1 | tee "$RUNNER_TEMP/stress.log"
          status=${PIPESTATUS[0]}
          # nextest (checked with 0.9.146) exits with the status of the LAST iteration only: a run
          # in which an earlier iteration failed and the last one passed exits 0. The summary line
          # counts them all, so a failed iteration anywhere fails the workflow.
          if sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/stress.log" | grep -Eq 'stress run iterations: .*[1-9][0-9]* failed'; then
            echo "::error::at least one iteration failed (see the summary line); nextest's exit status is that of the last iteration only"
            exit 1
          fi
          exit "$status"

      - name: Print what the bash hooks saw
        if: ${{ always() }}
        run: |
          trace="$RUNNER_TEMP/hook-trace.log"
          if [ -s "$trace" ]; then
            echo "::group::hook trace ($(wc -l < "$trace") lines)"
            cat "$trace"
            echo "::endgroup::"
          fi
