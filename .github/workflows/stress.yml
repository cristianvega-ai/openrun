name: Stress tests

# Runs a nextest filter many times on the runner the `Offline audit` job uses (4 vCPUs, Xvfb,
# optionally under the strace network sandbox), to reproduce and measure timing-dependent
# integration tests that do not fail on a development machine. Started by hand:
#
#   gh workflow run stress.yml -f filter='test(=ui_tests::test_focus_panes_on_hover)' -f count=30
#
# A failing iteration fails the run; nothing here blocks a merge.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: nextest filterset expression, e.g. test(=ui_tests::test_ctrl_c)
        required: true
        type: string
      count:
        description: Number of times to run the selection (nextest --stress-count)
        default: "20"
        type: string
      shell:
        description: Shell the tests start (bash or zsh)
        default: bash
        type: choice
        options: [bash, zsh]
      sandbox:
        description: Run under script/offline_sandbox (strace), as the Offline audit job does
        default: true
        type: boolean
      rust_log:
        description: RUST_LOG for the tests (empty keeps the default)
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  LINUX_BUILD_PACKAGES: >-
    build-essential cmake pkg-config protobuf-compiler libclang-dev
    libssl-dev libfreetype-dev libexpat1-dev libgit2-dev libfontconfig1-dev
  LINUX_TEST_PACKAGES: >-
    zsh fish fontconfig
    libx11-6 libxcb1 libxi6 libxcursor1 libxkbcommon-x11-0
    libwayland-client0 libwayland-egl1 libegl1 mesa-vulkan-drivers

jobs:
  # The job id is the one `ci.yml` uses for the audit job: rust-cache keys on it, so this run
  # restores the dependency build of the last push to `main`.
  offline-audit:
    name: Stress
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system packages
        run: |
          sudo apt-get update -y
          # shellcheck disable=SC2086 # The package lists are meant to be word-split.
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES $LINUX_TEST_PACKAGES \
            ripgrep strace xvfb iproute2

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Build the tests
        run: cargo nextest run --locked --workspace --no-run

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Same stubs as the Offline audit job.
      - name: Disable the GitHub and cloud CLIs and command-not-found
        run: |
          stubs="$RUNNER_TEMP/offline-stubs"
          mkdir -p "$stubs"
          for tool in gh kubectl docker podman aws az gcloud gsutil terraform helm doctl snap; do
            printf '#!/bin/sh\necho "%s: disabled in the offline sandbox" >&2\nexit 1\n' "$tool" > "$stubs/$tool"
            chmod +x "$stubs/$tool"
          done
          echo "$stubs" >> "$GITHUB_PATH"
          sudo chmod -x /usr/lib/command-not-found

      - name: Run the selection ${{ inputs.count }} times
        env:
          FILTER: ${{ inputs.filter }}
          COUNT: ${{ inputs.count }}
          SHELL_NAME: ${{ inputs.shell }}
          SANDBOX: ${{ inputs.sandbox }}
          STRESS_RUST_LOG: ${{ inputs.rust_log }}
        run: |
          WARP_SHELL_PATH=$(command -v "$SHELL_NAME")
          export WARP_SHELL_PATH
          if [ -n "$STRESS_RUST_LOG" ]; then
            export RUST_LOG="$STRESS_RUST_LOG"
          fi
          if [ "$SANDBOX" = "true" ]; then
            ./script/offline_sandbox net-stress.log xvfb-run -a \
              cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
                --stress-count "$COUNT" -E "$FILTER"
          else
            xvfb-run -a \
              cargo nextest run --locked --workspace --offline --no-fail-fast --retries 0 \
                --stress-count "$COUNT" -E "$FILTER"
          fi
