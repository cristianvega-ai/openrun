name: CI lab

# Measurements for the CI speed work (CI-SPEED). Started by hand, never on push, so it cannot block a
# merge. Removed when the measurements are recorded.
on:
  workflow_dispatch:
    inputs:
      archive_run:
        description: weight job - run id of a ci-next run whose test archive is used
        default: ""
        type: string
      archive_sha:
        description: weight job - the commit that run built
        default: ""
        type: string
      threads_required:
        description: weight job - weight of one integration test (nextest threads-required)
        default: "1"
        type: string
      shards:
        description: weight job - shards to run, as a JSON list
        default: "[1, 2, 3]"
        type: string
      repeats:
        description: weight job - times the shard runs (nextest --stress-count)
        default: "4"
        type: string
      chain:
        description: Commits to build in turn, as offsets below the dispatched commit
        default: "20 3 0"
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Bench ${{ matrix.name }}
    if: ${{ inputs.archive_run == '' }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ws
            incremental: "0"
            fix: "yes"
            debug: ""
          - name: inc
            incremental: "1"
            fix: "yes"
            debug: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Make sure the Metal toolchain is installed
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest

      - name: Build the chain of commits
        env:
          CHAIN: ${{ inputs.chain }}
          INCREMENTAL: ${{ matrix.incremental }}
          FIX: ${{ matrix.fix }}
          DEBUG_LEVEL: ${{ matrix.debug }}
        run: |
          set -euo pipefail
          cp script/ci_restore_mtimes "$RUNNER_TEMP/ci_restore_mtimes"
          export CARGO_INCREMENTAL=$INCREMENTAL
          if [ -n "$DEBUG_LEVEL" ]; then export CARGO_PROFILE_DEV_DEBUG=$DEBUG_LEVEL; fi
          tip=$(git rev-parse HEAD)
          previous=
          for offset in $CHAIN; do
            sha=$(git rev-parse "$tip~$offset")
            git checkout -q --detach "$sha"
            # A fresh checkout gives every file the time of the checkout.
            git ls-files -z | xargs -0 touch
            if [ "$FIX" = yes ] && [ -n "$previous" ]; then
              python3 "$RUNNER_TEMP/ci_restore_mtimes" apply target/ci-source-manifest.txt | head -8
            fi
            echo "::group::build $sha (offset $offset, previous: ${previous:-none})"
            start=$(date +%s)
            if ! cargo nextest archive --locked --workspace --archive-file "$RUNNER_TEMP/tests.tar.zst" > "$RUNNER_TEMP/build.log" 2>&1; then
              tail -40 "$RUNNER_TEMP/build.log"
              exit 1
            fi
            grep -E "^ +(Finished|Archived)" "$RUNNER_TEMP/build.log" || true
            echo "$(grep -c '^ *Compiling' "$RUNNER_TEMP/build.log") crates compiled"
            end=$(date +%s)
            echo "::endgroup::"
            echo "RESULT ${{ matrix.name }} offset=$offset sha=${sha:0:9} build_seconds=$((end - start)) archive=$(du -k "$RUNNER_TEMP/tests.tar.zst" | cut -f1)KB"
            python3 "$RUNNER_TEMP/ci_restore_mtimes" write target/ci-source-manifest.txt
            previous=$sha
            if [ -z "${first_done:-}" ]; then
              first_done=1
              du -sk target/debug/* 2>/dev/null | sort -rn | head -8 | sed 's/^/SIZE /'
            fi
          done
          echo "SIZE total $(du -sk target | cut -f1)KB"
          du -sk target/debug/incremental target/debug/deps target/debug/build target/debug/.fingerprint 2>/dev/null | sed 's/^/SIZE /'

      - name: Size and speed of a cache of the build directory
        run: |
          set -euo pipefail
          start=$(date +%s)
          tar -C . -cf - target ~/.cargo/registry/index ~/.cargo/registry/cache ~/.cargo/git/db 2>/dev/null | zstd -T0 -3 -o "$RUNNER_TEMP/cache.tar.zst"
          end=$(date +%s)
          echo "RESULT ${{ matrix.name }} cache_blob=$(du -k "$RUNNER_TEMP/cache.tar.zst" | cut -f1)KB compress_seconds=$((end - start))"
          mkdir "$RUNNER_TEMP/restore"
          start=$(date +%s)
          zstd -dc "$RUNNER_TEMP/cache.tar.zst" | tar -C "$RUNNER_TEMP/restore" -xf -
          end=$(date +%s)
          echo "RESULT ${{ matrix.name }} restore_seconds=$((end - start))"

  # Runs the integration tests many times with the weight of one test lowered to 1 (three at a
  # time on the three cores), from the archive of an earlier ci-next run, in the network sandbox
  # as the real jobs do. Any failure is a flake the lower weight introduced.
  weight:
    name: Weight ${{ inputs.threads_required }}, shard ${{ matrix.shard }}
    if: ${{ inputs.archive_run != '' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1, 2, 3]') }}
    env:
      WARP_NETWORK_SANDBOX_BY_PARENT: "1"
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.archive_sha }}
      - uses: ./.github/actions/rust-macos
        with:
          metal: "false"
      - uses: ./.github/actions/macos-test-tools
      - name: Download the test archive of run ${{ inputs.archive_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/test-archive"
          gh run download "${{ inputs.archive_run }}" -R "$GITHUB_REPOSITORY" -n test-archive -D "$RUNNER_TEMP/test-archive"
          echo "NEXTEST_ARCHIVE=$RUNNER_TEMP/test-archive/tests.tar.zst" >> "$GITHUB_ENV"
      - uses: ./.github/actions/offline-canary
      - name: Set the weight of an integration test
        env:
          THREADS_REQUIRED: ${{ inputs.threads_required }}
        run: sed -i '' "s/^threads-required = 2$/threads-required = $THREADS_REQUIRED/" .config/nextest.toml
      - name: Run the shard ${{ inputs.repeats }} times
        run: |
          WARP_SHELL_PATH=$(command -v zsh)
          export WARP_SHELL_PATH
          ./script/offline_sandbox_macos net-weight-${{ matrix.shard }}.log \
            ./script/ci_nextest weight-${{ matrix.shard }} --no-fail-fast --stress-count ${{ inputs.repeats }} \
              --partition hash:${{ matrix.shard }}/3 -E 'package(integration)'
      - uses: ./.github/actions/offline-check
        if: ${{ !cancelled() }}
        with:
          name: weight-${{ matrix.shard }}
          logs: net-weight-${{ matrix.shard }}.log
