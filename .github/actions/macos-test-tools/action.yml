name: macOS test tools
description: >-
  Installs the tools that real-tool tests run (docker command-line client, fish, PowerShell 7) and
  fails when any tool a test needs is missing. Missing required tools exit 86 and fail nextest.

runs:
  using: composite
  steps:
    # Only the command-line client is needed: the tests check what `docker` does with a remote
    # host or context, not containers.
    - name: Install the docker command-line client
      shell: bash
      run: |
        if ! command -v docker > /dev/null; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install docker
        fi

    # The injection tests run generator commands in real fish and PowerShell 7 (`pwsh`). fish
    # comes from Homebrew (a bottle, seconds). The macOS image ships pwsh; if a runner image does
    # not, it is installed from the Homebrew cask, which is slower.
    - name: Install fish and PowerShell
      shell: bash
      run: |
        if ! command -v fish > /dev/null; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install fish
        fi
        if ! command -v pwsh > /dev/null; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --cask powershell
        fi

    - name: Install project-interpreter regression tools
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v uv > /dev/null; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install uv
        fi
        if ! command -v go > /dev/null; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install go
        fi
        if ! command -v gcloud > /dev/null; then
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --cask gcloud-cli
        fi
        npm install --prefix "$RUNNER_TEMP/openrun-npm6" --ignore-scripts --no-audit --no-fund npm@6.14.18
        echo "OPENRUN_TEST_NPM6=$RUNNER_TEMP/openrun-npm6/node_modules/.bin/npm" >> "$GITHUB_ENV"

    - name: Check the tools the real-tool tests use
      shell: bash
      run: |
        missing=0
        for tool in git npm corepack rustup python3 uv go gcloud docker sandbox-exec fish pwsh zsh bash; do
          if path=$(command -v "$tool"); then
            echo "$tool: $path"
          else
            echo "::error::$tool is not installed on this runner"
            missing=1
          fi
        done
        if [ "$missing" -eq 0 ]; then
          git --version
          uv --version
          rustup --version
          docker --version
          "$OPENRUN_TEST_NPM6" --version
        fi
        exit "$missing"
