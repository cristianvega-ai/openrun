name: Build cache
description: >-
  Restores the build directory of the last build of `main` (workspace crates included) and puts the recorded modification times back on the files that did
  not change, so cargo rebuilds only what changed. The Build tests job saves the cache.

inputs:
  restore:
    description: Restore the cache (false builds from scratch).
    default: "true"

outputs:
  cache-hit:
    description: "'true' for an exact match, 'false' for the cache of an earlier commit, empty for none."
    value: ${{ steps.restore.outputs.cache-hit }}
  prefix:
    description: The prefix of the cache keys.
    value: ${{ steps.name.outputs.prefix }}

runs:
  using: composite
  steps:
    # Artifacts of another operating system or architecture are of no use, and neither are those
    # of an older runner image: build scripts probe the SDK and the compilers of the machine, and
    # cargo does not notice when those change. Bump the version to start a new cache.
    - name: Name the build cache
      id: name
      shell: bash
      run: |
        echo "prefix=build-v2-$RUNNER_OS-$RUNNER_ARCH-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        # No incremental compilation: it would put 3 GB more in the cache (restoring and saving
        # take a minute each) and was no faster on the changes measured in CI (CHANGES.md). The
        # build that saves the cache and the builds that use it must agree, as the setting is part
        # of cargo's fingerprint.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

    - name: Restore the build cache
      id: restore
      if: ${{ inputs.restore == 'true' }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ steps.name.outputs.prefix }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.name.outputs.prefix }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
          ${{ steps.name.outputs.prefix }}-

    - name: Put the recorded times back on the files that did not change
      if: ${{ steps.restore.outputs.cache-hit != '' }}
      shell: bash
      run: python3 script/ci_restore_mtimes apply target/ci-source-manifest.txt
