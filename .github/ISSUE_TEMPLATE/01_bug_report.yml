name: Bug Report
description: "Report something that doesn't work as expected. Search the existing issues first to avoid duplicates."
labels: ["bug"]
body:
  - type: checkboxes
    attributes:
      label: "Pre-submit Checks"
      options:
        - label: "I have searched the existing issues and this bug has not been reported yet"
          required: true
  - type: textarea
    id: "describe-the-bug"
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
      placeholder: Tell us what you see.
    validations:
      required: true
  - type: textarea
    id: "to-reproduce"
    attributes:
      label: "To reproduce"
      description: "Bug reports with clear reproduction steps are easier to fix."
      placeholder: "Steps to reproduce: 1. Go to '...' 2. Click on '...' 3. Scroll down to '...' 4. See error '...'"
    validations:
      required: true
  - type: textarea
    id: "expected-behavior"
    attributes:
      label: "Expected behavior"
      description: "A clear and concise description of what you expected to happen."
      placeholder: Tell us what you expect to see.
    validations:
      required: false
  - type: textarea
    id: "screenshots-logs"
    attributes:
      label: "Screenshots, videos, and logs"
      description: "If applicable, add screenshots, videos, or logs that show the problem. Redact any personal or confidential details."
    validations:
      required: false
  - type: dropdown
    id: "os"
    attributes:
      label: "Operating system (OS)"
      multiple: false
      options:
        - "Select an OS"
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: "os-version"
    attributes:
      label: "Operating system and version"
      description: "For example: Debian 11.2"
    validations:
      required: true
  - type: input
    id: "local-shell-version"
    attributes:
      label: "Shell version"
      description: "For example, `bash 5.2`. Run `bash --version` or `zsh --version`."
    validations:
      required: false
  - type: dropdown
    id: "session-type"
    attributes:
      label: "Session type"
      description: "Where does the bug happen? For SSH sessions, add the remote OS and shell version under Additional context."
      multiple: false
      options:
        - "Local session"
        - "SSH session"
        - "Both"
    validations:
      required: false
  - type: input
    id: "app-version"
    attributes:
      label: "App version or commit"
      description: "The release version, or the commit you built from (`git rev-parse --short HEAD`)."
    validations:
      required: false
  - type: dropdown
    id: "regression"
    attributes:
      label: "Regression"
      description: "Did this work in an earlier version?"
      multiple: false
      options:
        - "No, this has always happened"
        - "Yes, this started recently"
    validations:
      required: true
  - type: textarea
    id: "additional-context"
    attributes:
      label: "Additional context"
      description: "Add any other context about the problem here. On Linux, tell us whether you use X11 or Wayland. For graphical issues, start the app with `RUST_LOG=wgpu_core=info,wgpu_hal=info MESA_DEBUG=1 EGL_LOG_LEVEL=debug`, attach the logs, and include the output of `eglinfo`."
    validations:
      required: false
  - type: dropdown
    id: "terminals"
    attributes:
      label: "Does this happen in other terminals?"
      multiple: false
      options:
        - "No, it only happens in this terminal"
        - "Yes, it also happens in other terminals"
        - "I haven't checked"
    validations:
      required: true
