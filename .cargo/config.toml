[env]
# This is used to set the minimum deployment target for mac
# https://cmake.org/cmake/help/latest/envvar/MACOSX_DEPLOYMENT_TARGET.html
# If unset, it uses the system one, but we want to build for older versions
# of mac os by default.
#
# This should be kept in sync with the definition of this variable in
# `script/bundle`.
MACOSX_DEPLOYMENT_TARGET = "10.14"

[net]
git-fetch-with-cli = true

# Use the v0 symbol mangling scheme. It encodes generic instantiations (which the legacy scheme
# hashes away irreversibly), improving demangled names in backtraces and profiles.
# The headerpad leaves room for `install_name_tool` to rewrite the install names in a bundle.
[target.'cfg(all())']
rustflags = [
  "-C", "symbol-mangling-version=v0",
  "-C", "link-args=-Wl,-headerpad_max_install_names",
]
